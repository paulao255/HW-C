name: Makefile Test

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Make Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux
      - name: Install Clang and Make (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make

      # Windows
      - name: Setup MSYS2 CLANG64 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            make
            mingw-w64-clang-x86_64-clang

      # macOS
      - name: Check Clang and Make
        shell: bash
        run: |
          clang --version
          make --version

      # Run Makefile
      - name: Run make test
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: make test
