name: Makefile Test

on:
  push:
    branches:
      - '**'

  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - name: Linux - GCC
            os: ubuntu-latest
            shell: bash
            compiler: gcc

          - name: Linux - Clang
            os: ubuntu-latest
            shell: bash
            compiler: clang

          # macOS
          - name: macOS - Clang
            os: macos-latest
            shell: bash
            compiler: clang

          # Windows / MSYS2
          - name: Windows - GCC (UCRT64)
            os: windows-latest
            shell: msys2 {0}
            msystem: UCRT64
            compiler: gcc

          - name: Windows - Clang (CLANG64)
            os: windows-latest
            shell: msys2 {0}
            msystem: CLANG64
            compiler: clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc clang

      # macOS
      - name: Check build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          make --version
          clang --version

      # Windows / MSYS2
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            make
            ${{ matrix.compiler == 'gcc' && 'mingw-w64-ucrt-x86_64-gcc' || 'mingw-w64-clang-x86_64-clang' }}

      # Show toolchain
      - name: Check build tools
        run: |
          make --version
          ${{ matrix.compiler }} --version

      # Run the Makefile target
      - name: Run make test
        run: make test
